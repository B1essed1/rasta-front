# DEPRECATED for deployment -- kept as a reference only.
#
# This file was written for the Docker image (root /usr/share/nginx/html,
# proxy_pass http://backend:8080 via Compose DNS). On a native server nginx
# refuses to start with `host not found in upstream "backend"`.
#
# The live configuration is version-controlled in the BACKEND repo:
#   rasta-back/deploy/nginx/labaratory.rastashops.com.conf
#   rasta-back/deploy/nginx/dev-api.rastashops.com.conf
#   rasta-back/deploy/nginx/{00-global,security-headers,proxy-backend}.conf
# and installed by rasta-back/deploy/bootstrap.sh.
#
# Kept here because the Dockerfile still references it for local container
# builds; delete both if the Docker path is retired.

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Spring accepts 10MB uploads; nginx defaults to 1m and would 413 first.
        client_max_body_size 10m;
    }

    location ^~ /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
